[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "local-transcriber"
version = "0.0.1"
description = "Stage 0: offline transcription and diarization CLI prototype"
requires-python = ">=3.11,<3.14"
dependencies = ["whisperx==3.8.6", "psutil>=7", "transformers<5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
local-transcriber = "local_transcriber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires local model files and a CUDA environment"]
